<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SourceLens</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1c2030;--mute:#667085;--line:#e4e7ee;--accent:#4f46e5;--soft:#eef0ff;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--text:#e8eaf3;--mute:#9aa3b8;--line:#2a3050;--accent:#8b8cf8;--soft:#232850;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 28px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:10px}
.drop:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:10px}
.chips{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.chip.on{border-color:var(--accent);background:var(--soft)}
.chip small{color:var(--mute);text-align:right}
.status{font-size:13px;color:var(--mute);margin-top:8px;white-space:pre-wrap}
.answer{white-space:pre-wrap;font-size:16px}
.cite{display:inline-block;background:var(--soft);color:var(--accent);border-radius:6px;padding:0 6px;font:12px ui-monospace,monospace;margin:0 1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ev{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
.ev img{width:100%;height:130px;object-fit:cover;display:block;background:var(--bg)}
.ev div{padding:6px 8px;color:var(--mute)}
.src{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.src:first-child{border-top:0}.src a{color:var(--accent)}.src span{color:var(--mute)}
.err{color:var(--bad)}
</style>
</head>
<body>
<header><h1>SourceLens</h1><p>Ask your PDFs, videos and images. Every answer shows its evidence.</p></header>
<main>
<aside>
  <div class="card"><h2>1 · Add to library</h2>
    <label class="drop"><input id="files" type="file" multiple hidden><span id="dtext">Click to choose PDFs, videos or images</span></label>
    <input id="url" type="text" placeholder="…or paste a video link">
    <div class="row"><button id="add">Add to library</button></div>
    <div class="status" id="status"></div></div>
  <div class="card"><h2>Library · click to limit the search</h2><div class="chips" id="lib"></div></div>
</aside>
<section>
  <div class="card"><h2>2 · Ask</h2>
    <div class="row" style="margin-top:0"><input id="q" type="text" placeholder="Ask a question about your library"><button id="ask">Ask</button></div>
    <div class="status" id="scope">Searching all files</div></div>
  <div class="card" id="out" hidden><h2>Answer</h2><div class="answer" id="ans"></div></div>
  <div class="card" id="evc" hidden><h2>Evidence</h2><div class="grid" id="ev"></div></div>
  <div class="card" id="srcc" hidden><h2>Sources</h2><div id="srcs"></div></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const chosen = new Set();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) {
    let m = r.statusText;
    try { const d = (await r.json()).detail; m = typeof d === 'string' ? d : JSON.stringify(d); } catch (e) {}
    throw new Error(m);
  }
  return r.json();
}

// Show the model's text safely: [citations] become badges, **bold** is kept.
function fmt(text) {
  const frag = document.createDocumentFragment();
  text.split(/(\[[^\]]+\]|\*\*[^*]+\*\*)/).forEach(p => {
    if (/^\[[^\]]+\]$/.test(p)) frag.append(el('span', 'cite', p.slice(1, -1)));
    else if (/^\*\*[^*]+\*\*$/.test(p)) frag.append(el('strong', null, p.slice(2, -2)));
    else frag.append(p);
  });
  return frag;
}

function showScope() {
  $('scope').textContent = chosen.size ? 'Searching only: ' + [...chosen].join(', ') : 'Searching all files';
}

async function loadLibrary() {
  const items = await api('/api/library');
  const box = $('lib');
  box.replaceChildren();
  if (!items.length) box.append(el('div', 'status', 'The library is empty.'));
  items.forEach(it => {
    const chip = el('div', 'chip' + (chosen.has(it.source) ? ' on' : ''));
    chip.append(el('span', null, it.source),
                el('small', null, Object.entries(it.kinds).map(([k, n]) => n + ' ' + k).join(', ')));
    chip.onclick = () => { chosen.has(it.source) ? chosen.delete(it.source) : chosen.add(it.source); showScope(); loadLibrary(); };
    box.append(chip);
  });
  showScope();
}

$('files').onchange = () => {
  const n = $('files').files.length;
  $('dtext').textContent = n ? n + ' file(s) selected' : 'Click to choose PDFs, videos or images';
};

$('add').onclick = async () => {
  if (!$('files').files.length && !$('url').value.trim()) { $('status').textContent = 'Choose a file or paste a link first.'; return; }
  const fd = new FormData();
  for (const f of $('files').files) fd.append('files', f);
  fd.append('url', $('url').value);
  $('add').disabled = true;
  $('status').textContent = 'Adding… videos can take a minute or two.';
  try {
    const res = await api('/api/ingest', { method: 'POST', body: fd });
    $('status').textContent = res.map(r => r.ok ? 'Added ' + r.name + ' (' + r.records + ' records)' : 'Failed: ' + r.name + ' – ' + r.error).join('\n');
    res.filter(r => r.ok).forEach(r => chosen.add(r.name));
    $('files').value = ''; $('url').value = ''; $('dtext').textContent = 'Click to choose PDFs, videos or images';
    await loadLibrary();
  } catch (e) { $('status').textContent = 'Error: ' + e.message; }
  $('add').disabled = false;
};

async function ask() {
  const q = $('q').value.trim();
  if (!q) return;
  $('ask').disabled = true;
  ['evc', 'srcc'].forEach(i => $(i).hidden = true);
  $('out').hidden = false;
  $('ans').textContent = 'Thinking…';
  try {
    const r = await api('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ question: q, sources: [...chosen] }) });
    $('ans').replaceChildren(fmt(r.answer));
    const ev = $('ev'); ev.replaceChildren();
    r.hits.filter(h => h.image).forEach(h => {
      const card = el('div', 'ev'); const img = el('img'); img.src = h.image; img.loading = 'lazy';
      card.append(img, el('div', null, h.cite.replace(/[\[\]]/g, '')));
      ev.append(card);
    });
    $('evc').hidden = !ev.children.length;
    const list = $('srcs'); list.replaceChildren();
    r.hits.forEach(h => {
      const row = el('div', 'src'); const label = h.cite.replace(/[\[\]]/g, '');
      if (h.link) { const a = el('a', null, label); a.href = h.link; a.target = '_blank'; row.append(a); }
      else row.append(el('strong', null, label));
      row.append(el('span', null, '  score ' + h.score + ' · ' + h.snippet));
      list.append(row);
    });
    $('srcc').hidden = !r.hits.length;
  } catch (e) { $('ans').replaceChildren(el('span', 'err', 'Error: ' + e.message)); }
  $('ask').disabled = false;
}
$('ask').onclick = ask;
$('q').onkeydown = e => { if (e.key === 'Enter') ask(); };
loadLibrary();
</script>
</body>
</html>
